    <div class="contact-section">
      <h1 class="mb-4 text-center ">Contact Us</h1>
    </div>

      <p>If you have any questions, feel free to send us a message using the form below.</p>

      <form action="mailto:knowcv@gmail.cv" method="POST" class="mt-3">

        <div class="mb-3">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" id="name" name="name" class="form-control" required maxlength="40" />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required maxlength="70" />
        </div>

        <fieldset class="mb-3">
          <legend>What do you want to receive?</legend>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="selection" id="trip-plan" value="trip-plan" required />
            <label class="form-check-label" for="trip-plan">Trip plan</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="selection" id="recommendations" value="recommendations" />
            <label class="form-check-label" for="recommendations">Recommendations</label>
          </div>
        </fieldset>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="agree" required />
          <label class="form-check-label" for="agree">I agree to receive emails</label>
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Your Message</label>
          <textarea id="message" name="message" rows="3" class="form-control" maxlength="200"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

      </form>
